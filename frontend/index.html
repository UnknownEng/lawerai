          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Under Section 489-F of the Pakistan Penal Code (PPC 1860), dishonestly issuing a cheque that bounces due to insufficient funds is a cognizable criminal offence punishable with imprisonment up to 3 years or fine, alongside summary civil suit recovery under Order 37 of the Code of Civil Procedure (CPC 1908)."
          }

          "acceptedAnswer": {
            "@type": "Answer",
            "text": "If the police SHO refuses to register a cognizable offence FIR under Section 154 CrPC, the aggrieved party may file a petition under Section 22-A & 22-B CrPC before the Ex-Officio Justice of Peace (Sessions Judge) seeking a judicial direction ordering the police to register the FIR."
          }
        },
