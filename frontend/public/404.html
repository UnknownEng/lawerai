<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Page Not Found — LawerAI</title>
    <meta name="description" content="The page you requested does not exist on LawerAI. Return to our legal intelligence portal by Maverick Tech Ventures or search our statutory corpus." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 40px;
        max-width: 540px;
        width: 100%;
        text-align: center;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      }
      .badge {
        display: inline-block;
        background: #fef2f2;
        color: #b91c1c;
        border: 1px solid #fecaca;
        font-weight: 700;
        font-size: 14px;
        padding: 4px 12px;
        border-radius: 9999px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 28px;
        font-weight: 800;
        margin: 0 0 12px;
        color: #064e3b;
      }
      p {
        font-size: 15px;
        color: #475569;
        line-height: 1.6;
        margin: 0 0 24px;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      a.btn-primary {
        background: #064e3b;
        color: #ffffff;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        transition: background 0.2s;
      }
      a.btn-primary:hover {
        background: #065f46;
      }
      a.btn-secondary {
        background: #f1f5f9;
        color: #334155;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
      }
      a.btn-secondary:hover {
        background: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">HTTP 404</span>
      <h1>Page Not Found</h1>
      <p>The legal section, case link, or resource you are looking for has been moved, archived, or does not exist.</p>
      <div class="actions">
        <a href="/" class="btn-primary">Return to LawerAI Home</a>
        <a href="/?open=statutes" class="btn-secondary">Search Statutory Corpus</a>
        <a href="/?open=directory" class="btn-secondary">View Legal Aid Directory</a>
      </div>
    </div>
  </body>
</html>
